# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "RiemannJensen"
  authors: [Kenny Lau]
  description: >
    `RiemannJensen` is a formal proof of the main theorems of *An asymptotic Jensen-Polya
    criterion for GRH* (arXiv:2610.38870): for every number field $K$ and all large $d$, the
    degree-$d$ Jensen polynomial $J_{K,d}$ of the Dedekind xi function is nonzero and has at least
    $d - C_K \sqrt{d \log d}$ distinct negative real zeros (Theorem 3), and for every $d \ge 2$ the
    Riemann Jensen polynomial $J_d$ has at least $d - C \sqrt{d \log d}$ distinct negative real
    zeros (Theorem 1). It also
    proves that the Dedekind zeta function has a unique analytic continuation to
    $\mathbb{C} \setminus \{1\}$. The Lean files were generated by AxiomProver, Axiom Math's
    in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "Apache-2.0"

repository:
  role: "substantive-development"

sources:
  - title: "An asymptotic Jensen-Polya criterion for GRH"
    authors: [Ken Ono]
    id: "https://arxiv.org/abs/2610.38870"
    type: "article"
    location: "Theorem 1 and Theorem 3"
    relationship: "formalizes"
    note: >
      Formalizes Theorems 1 and 3.

classification:
  arxiv: [math.NT]
  msc2020: [11R42, 11M26, 30C15]

status:
  scope: >
    Theorem 3 for every number field $K$ and Theorem 1 for every $d \ge 2$. The Dedekind zeta
    function is taken to be its analytic continuation to $\mathbb{C} \setminus \{1\}$, whose
    existence and uniqueness are proved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "RiemannJensen.Challenge.dedekind_thm_main"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
  - declaration: "RiemannJensen.Challenge.riemannJensen_main"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
  - declaration: "RiemannJensen.Challenge.exists_isDedekindZetaContinuation"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
  - declaration: "RiemannJensen.Challenge.isDedekindZetaContinuation_unique"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal challenge in `Challenge/Basic.lean` was checked against the source paper by an
    author of that paper.

alignment:
  statements:
    - source: "An asymptotic Jensen-Polya criterion for GRH (Theorem 3)"
      lean: "RiemannJensen.Challenge.dedekind_thm_main"
      module: "Solution.Basic"
      status: "Proved."
    - source: "An asymptotic Jensen-Polya criterion for GRH (Theorem 1)"
      lean: "RiemannJensen.Challenge.riemannJensen_main"
      module: "Solution.Basic"
      status: "Proved, together with the bound of at most $C \\sqrt{d \\log d}$ nonreal zeros from the end of the proof of Theorem 3."
    - source: "An asymptotic Jensen-Polya criterion for GRH (definition of $\\zeta_K$ preceding (1.6))"
      lean: "RiemannJensen.Challenge.exists_isDedekindZetaContinuation"
      module: "Solution.Basic"
      status: "Proved. The paper defines $\\zeta_K$ as the meromorphic continuation of its Dirichlet series; the Lean file proves that a continuation holomorphic on $\\mathbb{C} \\setminus \\{1\\}$ exists."
    - source: "An asymptotic Jensen-Polya criterion for GRH (definition of $\\zeta_K$ preceding (1.6))"
      lean: "RiemannJensen.Challenge.isDedekindZetaContinuation_unique"
      module: "Solution.Basic"
      status: "Proved. Any two such continuations agree on $\\mathbb{C} \\setminus \\{1\\}$."
